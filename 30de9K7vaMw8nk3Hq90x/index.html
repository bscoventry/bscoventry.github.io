<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Keep this page out of search engines and off crawlers -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Brandon S Coventry, PhD - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #fff;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 15, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #5568d3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            font-weight: 600;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .title {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }

        .dept {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            transition: background 0.2s;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .contact-item:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: #667eea;
        }

        .save-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #5568d3;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="networkCanvas"></canvas>

    <div class="card">
        <div class="avatar">BC</div>
        <h1>Brandon S Coventry, PhD</h1>
        <p class="title">Neural Engineering &amp; Brain Stimulation</p>
        <p class="dept">Department of Neurological Surgery<br>University of Wisconsin&ndash;Madison</p>

        <div class="contact-list">
            <a class="contact-item" href="mailto:coventry@wisc.edu">
                <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span>coventry@wisc.edu</span>
            </a>
            <a class="contact-item" href="https://bscoventry.github.io" target="_blank" rel="noopener">
                <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 000 18M12.5 3a17 17 0 010 18"/></svg>
                <span>Research Lab Website</span>
            </a>
            <a class="contact-item" href="tel:+12178531585">
                <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <span>+1 (217) 853-1585</span>
            </a>
            <div class="contact-item" style="cursor: default;">
                <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>Dept. of Neurological Surgery, UW&ndash;Madison</span>
            </div>
        </div>

        <button class="save-btn" onclick="saveContact()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Save Contact
        </button>
    </div>

    <div class="toast" id="toast">Contact saved!</div>

    <script>
        // ---- vCard download ----
        function saveContact() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Coventry;Brandon;S;;PhD',
                'FN:Brandon S Coventry, PhD',
                'ORG:University of Wisconsin-Madison;Department of Neurological Surgery',
                'TITLE:Neural Engineering & Brain Stimulation Researcher',
                'EMAIL;TYPE=INTERNET,WORK:coventry@wisc.edu',
                'TEL;TYPE=WORK,VOICE:+1-555-123-4567',
                'URL:https://bscoventry.github.io',
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'brandon-coventry.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---- Background network animation (matches main site) ----
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            // Use the canvas's own rendered box rather than window.innerWidth/
            // innerHeight, which can be unreliable inside embedded/sandboxed
            // preview iframes.
            const rect = canvas.getBoundingClientRect();
            const w = Math.round(Math.max(rect.width, document.documentElement.clientWidth || 0));
            const h = Math.round(Math.max(rect.height, document.documentElement.clientHeight || 0));
            const sizeChanged = canvas.width !== w || canvas.height !== h;
            canvas.width = w;
            canvas.height = h;
            // Only re-scatter nodes when the canvas actually changes size
            // meaningfully (not on sub-pixel/mobile-chrome-bar wobble),
            // otherwise just keep existing nodes where they are.
            if (sizeChanged && typeof initNodes === 'function') initNodes();
        }

        const nodes = [];
        const nodeCount = 100;
        const maxDistance = 170;

        class Node {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.radius = 1.8;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
            }
        }

        function initNodes() {
            nodes.length = 0;
            for (let i = 0; i < nodeCount; i++) nodes.push(new Node());
        }
        resizeCanvas();
        initNodes();

        function drawConnections() {
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < maxDistance) {
                        const opacity = (1 - distance / maxDistance) * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            // Periodically confirm canvas still matches its rendered size
            // (handles late layout/resize in embedded or mobile contexts)
            // without re-scattering nodes on harmless sub-pixel wobble.
            const rect = canvas.getBoundingClientRect();
            const targetW = Math.round(Math.max(rect.width, document.documentElement.clientWidth || 0));
            const targetH = Math.round(Math.max(rect.height, document.documentElement.clientHeight || 0));
            if (Math.abs(canvas.width - targetW) > 2 || Math.abs(canvas.height - targetH) > 2) {
                resizeCanvas();
            }
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawConnections();
            nodes.forEach(n => { n.update(); n.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', resizeCanvas);
        if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(resizeCanvas).observe(document.documentElement);
        }
    </script>
</body>
</html>
